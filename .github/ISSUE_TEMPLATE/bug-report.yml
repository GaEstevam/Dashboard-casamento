name: Relatar problema
description: Informe um comportamento inesperado sem compartilhar dados pessoais.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador e sistema operacional
      placeholder: Opera 120 / Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi nomes, contatos e outros dados pessoais do relato.
          required: true
